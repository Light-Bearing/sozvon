# Настройка ретранслятора. На настоящей машине отличается только
# external-ip и тем, что ключ подставляет человек, а не файл в стенде.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=sozvon.lab
min-port=49160
max-port=49300

# Чтобы ретранслятор не стал отмычкой к внутренней сети машины, на
# которой стоит. Без этих строк любой с пропуском стучится к её соседям.
no-multicast-peers
no-loopback-peers
no-cli
no-tlsv1
no-tlsv1_1
