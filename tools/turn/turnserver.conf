# Ретранслятор для «Созвона» — настройка coturn.
#
# Он перекладывает пакеты вслепую: шифрование живёт между браузерами,
# ключей от разговора у него нет и быть не может. Видит он только то, кто
# с кем и сколько говорил.
#
# ВАЖНО: адрес в двух первых строках и ключ подставляются при установке,
# см. соседний файл «установка.md». Готового ключа в этом файле нет и
# быть не должно — он не место для секретов.

listening-ip=ПОДСТАВИТЬ_ПУБЛИЧНЫЙ_АДРЕС
external-ip=ПОДСТАВИТЬ_ПУБЛИЧНЫЙ_АДРЕС
listening-port=3478

# По порту на каждое ВЫДЕЛЕНИЕ, а не на разговор. Выделений у одного
# человека бывает много: браузер просит место на каждый адрес
# ретранслятора (обычный и по TCP) для каждого соединения, а старые
# сборки «Созвона» давали ретранслятор даже сорока заготовкам библиотеки —
# восемьдесят просьб за один вход. Сотни портов хватало ровно на одного
# такого человека. Полторы тысячи — с запасом для своего круга.
min-port=49160
max-port=50659

realm=sozvon
use-auth-secret
static-auth-secret=ПОДСТАВИТЬ_КЛЮЧ

fingerprint
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600

# Без этих строк ретранслятор становится отмычкой к внутренностям самой
# машины: любой, у кого есть пропуск, сможет через него стучаться к её
# соседям по внутренней сети и к метаданным облака на 169.254.169.254.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# Потолок, чтобы одно имя не съело машину целиком. Двенадцать было мало:
# их разбирали заготовки, и настоящему соединению места не доставалось.
# total-quota не больше числа портов — иначе упрёмся в порты раньше.
user-quota=100
total-quota=1000

# Журнал в journald. Без него, когда ретранслятор «не помог», узнать
# почему невозможно: journalctl -u coturn
syslog
