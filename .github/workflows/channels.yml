name: Сторож каналов

# Публичные каналы, через которые люди находят друг друга, смертны. Однажды
# какой-то из них замолчит, и приложение начнёт молча биться в мёртвый
# адрес — а руками пробник раз в неделю не прогонит никто.
#
# Раз в неделю пробник проверяет ровно те каналы, которыми пользуется
# приложение. Умер хоть один — проверка краснеет, GitHub присылает письмо,
# а в отчёте прогона перечислены самые быстрые живые запасные. Список сам
# не правится: заменить канал — решение человека.
#
# Оговорка: машина GitHub стоит в дата-центре, а некоторые релеи режут
# дата-центры. Тогда сторож покраснеет зря — проверить руками с дома:
#   node tools/probe.mjs --channels

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/probe.mjs --channels
